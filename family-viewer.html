<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Family Intelligence | GHOST by Developer Saif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #ff44cc;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #ff44cc;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #ff44cc20;
            color: #ff44cc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 120px;
            text-align: center;
            border-bottom: 3px solid #ff44cc;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #ff44cc;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Progress Log */
        .progress-log {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 8px 12px;
            margin: 5px 0;
            border-left: 3px solid;
            background: #0a0e0a;
            border-radius: 3px;
            line-height: 1.4;
        }

        .log-info { border-left-color: #00aaff; color: #88ccff; }
        .log-success { border-left-color: #00ff88; color: #88ffaa; }
        .log-warning { border-left-color: #ffaa00; color: #ffcc66; }
        .log-error { border-left-color: #ff3355; color: #ff8888; }

        /* Family Cards */
        .family-card {
            background: #1a1a2e;
            border-radius: 15px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid #2a2a4e;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: linear-gradient(135deg, #ff44cc20, #2a1a4e);
            padding: 20px;
            border-bottom: 1px solid #ff44cc40;
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff44cc;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 12px;
            color: #aaa;
        }

        .source-badge {
            display: inline-block;
            background: #ff44cc20;
            color: #ff44cc;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            margin-top: 8px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .info-item {
            background: #0a0e0a;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #ff44cc;
        }

        .info-label {
            font-size: 10px;
            color: #ff44cc;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 14px;
            color: #ddd;
            word-break: break-word;
            line-height: 1.4;
        }

        /* Members Section */
        .members-section {
            padding: 0 20px 20px 20px;
        }

        .section-title {
            font-size: 16px;
            color: #ff44cc;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ff44cc40;
        }

        .member-item {
            background: #0a0e0a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .member-item:hover {
            background: #1a1a3e;
            transform: translateX(5px);
        }

        .member-name {
            font-size: 16px;
            font-weight: bold;
            color: #ff88dd;
        }

        .member-details {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 12px;
            color: #aaa;
        }

        /* Monthly Summary */
        .summary-section {
            padding: 0 20px 20px 20px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .summary-item {
            background: #0a0e0a;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .summary-month {
            color: #ff44cc;
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* Share Section */
        .share-section {
            padding: 20px;
            border-top: 1px solid #2a2a4e;
            background: #0a0e0a;
        }

        .share-link {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .share-input {
            flex: 1;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #ff44cc40;
            border-radius: 5px;
            color: #ff44cc;
            font-size: 12px;
            font-family: monospace;
        }

        .copy-btn {
            background: #ff44cc;
            color: #0a0e0a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #ff66dd;
            transform: scale(1.02);
        }

        /* No Results */
        .no-results {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            color: #aaa;
        }

        /* Hidden utility */
        .hidden {
            display: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff44cc;
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .member-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .stats-bar {
                flex-direction: column;
            }
            h1 {
                font-size: 22px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍👩‍👧‍👦 FAMILY INTELLIGENCE</h1>
            <div class="subtitle">Powered by GHOST OSINT | Developer Saif</div>
            <div class="status-badge" id="statusBadge">🔄 INITIALIZING...</div>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalAadhaars">0</div>
                <div class="stat-label">AADHAARS SCANNED</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueFamilies">0</div>
                <div class="stat-label">UNIQUE FAMILIES</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalMembers">0</div>
                <div class="stat-label">FAMILY MEMBERS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="duplicatesRemoved">0</div>
                <div class="stat-label">DUPLICATES</div>
            </div>
        </div>

        <div id="progressContainer">
            <div class="progress-log" id="progressLog"></div>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://aadharfam.onrender.com/full-search';
        const MAX_CONCURRENT = 5;
        
        // State
        let uniqueFamilies = new Map();
        let processedAadhaars = new Set();
        let totalDuplicates = 0;
        let isScanComplete = false;
        
        // Get Aadhaars from URL
        const urlParams = new URLSearchParams(window.location.search);
        let aadhaarsList = [];
        
        if (urlParams.has('aadhaars')) {
            aadhaarsList = urlParams.get('aadhaars').split(',').map(a => a.trim()).filter(a => a.length > 0);
        } else if (urlParams.has('aadhaar')) {
            aadhaarsList = [urlParams.get('aadhaar').trim()];
        } else if (urlParams.has('ids')) {
            aadhaarsList = urlParams.get('ids').split(',').map(a => a.trim());
        }
        
        // Remove duplicates from input
        aadhaarsList = [...new Set(aadhaarsList)];
        
        if (aadhaarsList.length > 0) {
            document.getElementById('statusBadge').innerHTML = `⚡ SCANNING ${aadhaarsList.length} AADHAAR(S)`;
            scanAllAadhaarsParallel();
        } else {
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('resultsContainer').innerHTML = `
                <div class="no-results">
                    <div style="font-size: 48px; margin-bottom: 15px;">🆔</div>
                    <div style="font-size: 18px; color: #ff44cc; margin-bottom: 10px;">No Aadhaar Numbers Provided</div>
                    <div style="color: #aaa; font-size: 14px;">Use: ?aadhaars=123456789012,987654321098</div>
                </div>
            `;
            document.getElementById('statusBadge').innerHTML = `❌ NO AADHAARS PROVIDED`;
        }
        
        async function scanAllAadhaarsParallel() {
            addLog(`🚀 Starting scan of ${aadhaarsList.length} Aadhaar(s) (${MAX_CONCURRENT} at a time)`, 'info');
            
            const results = [];
            const queue = [...aadhaarsList];
            let completedCount = 0;
            
            async function processBatch(batch) {
                const batchPromises = batch.map(async (aadhaar) => {
                    if (processedAadhaars.has(aadhaar)) {
                        addLog(`⏭️ Skipping duplicate: ${aadhaar}`, 'warning');
                        return null;
                    }
                    
                    addLog(`🔍 Scanning: ${aadhaar}`, 'info');
                    const data = await fetchFamilyData(aadhaar);
                    
                    if (data && data.success && data.details) {
                        processedAadhaars.add(aadhaar);
                        return { aadhaar, data };
                    } else {
                        addLog(`❌ No data: ${aadhaar}`, 'error');
                        return null;
                    }
                });
                
                const batchResults = await Promise.all(batchPromises);
                return batchResults.filter(r => r !== null);
            }
            
            // Process in batches
            for (let i = 0; i < queue.length; i += MAX_CONCURRENT) {
                const batch = queue.slice(i, i + MAX_CONCURRENT);
                const batchResults = await processBatch(batch);
                results.push(...batchResults);
                
                completedCount = Math.min(i + MAX_CONCURRENT, queue.length);
                addLog(`📊 Progress: ${completedCount}/${queue.length} Aadhaars processed`, 'info');
            }
            
            // Organize results by unique families
            addLog(`🔄 Organizing ${results.length} result(s) into unique families...`, 'info');
            
            for (const result of results) {
                const { aadhaar, data } = result;
                const rationCardId = data.ration_card_id;
                
                if (uniqueFamilies.has(rationCardId)) {
                    const existing = uniqueFamilies.get(rationCardId);
                    existing.sourceAadhaars.push(aadhaar);
                    totalDuplicates++;
                    addLog(`⚠️ Duplicate: ${rationCardId} (also from ${existing.sourceAadhaars[0]})`, 'warning');
                } else {
                    data.sourceAadhaars = [aadhaar];
                    uniqueFamilies.set(rationCardId, data);
                    const memberCount = data.details?.members?.length || 0;
                    addLog(`✅ New family: ${rationCardId} (${memberCount} members)`, 'success');
                }
            }
            
            updateStats();
            addLog(`🎉 COMPLETE! ${uniqueFamilies.size} unique family(ies) found`, 'success');
            
            // Mark scan as complete and display results
            isScanComplete = true;
            displayResults();
            document.getElementById('statusBadge').innerHTML = `✅ SCAN COMPLETE - ${uniqueFamilies.size} FAMILIES FOUND`;
        }
        
        async function fetchFamilyData(aadhaar) {
            const url = `${API_URL}?aadhaar=${aadhaar}`;
            
            // Try direct fetch
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                // Continue to proxy
            }
            
            // Try with proxy
            try {
                const proxyUrl = `https://cors-anywhere.herokuapp.com/${url}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                // Fail gracefully
            }
            
            return null;
        }
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('progressLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            
            // Only add spinner for scanning messages that are still active
            let displayMessage = message;
            if (type === 'info' && message.includes('Scanning:') && !isScanComplete) {
                displayMessage = `🔄 ${message}`;
            } else if (type === 'success') {
                displayMessage = `✅ ${message}`;
            } else if (type === 'error') {
                displayMessage = `❌ ${message}`;
            } else if (type === 'warning') {
                displayMessage = `⚠️ ${message}`;
            }
            
            logEntry.innerHTML = `${getTimestamp()} ${displayMessage}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function getTimestamp() {
            const now = new Date();
            return `[${now.toLocaleTimeString()}]`;
        }
        
        function updateStats() {
            const totalMembers = Array.from(uniqueFamilies.values()).reduce((sum, f) => sum + (f.details?.members?.length || 0), 0);
            
            document.getElementById('totalAadhaars').textContent = processedAadhaars.size;
            document.getElementById('uniqueFamilies').textContent = uniqueFamilies.size;
            document.getElementById('totalMembers').textContent = totalMembers;
            document.getElementById('duplicatesRemoved').textContent = totalDuplicates;
            document.getElementById('statsBar').style.display = 'flex';
        }
        
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            
            if (uniqueFamilies.size === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div style="font-size: 48px; margin-bottom: 15px;">❌</div>
                        <div style="font-size: 18px; color: #ff44cc; margin-bottom: 10px;">No Family Data Found</div>
                        <div style="color: #aaa; font-size: 14px;">No valid family information found for the provided Aadhaar numbers.</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let familyNumber = 1;
            
            for (const [rationCardId, family] of uniqueFamilies) {
                const details = family.details;
                const cardInfo = details.card_info || {};
                const members = details.members || [];
                const monthlySummary = details.monthly_summary || [];
                const sources = family.sourceAadhaars;
                
                html += `
                    <div class="family-card">
                        <div class="card-header">
                            <div class="card-title">🎫 FAMILY #${familyNumber}: ${rationCardId}</div>
                            <div class="card-subtitle">
                                Found from ${sources.length} Aadhaar source(s)
                                ${sources.length > 1 ? '<span style="color: #ff44cc; margin-left: 8px;">✨ Auto-deduplicated</span>' : ''}
                            </div>
                            <div class="source-badge">🆔 Sources: ${sources.join(', ')}</div>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">🏠 CARD TYPE</div>
                                <div class="info-value">${escapeHtml(cardInfo.Card_Type || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📍 DISTRICT</div>
                                <div class="info-value">${escapeHtml(cardInfo.District || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📅 ISSUE DATE</div>
                                <div class="info-value">${escapeHtml(cardInfo.Issue_Date || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📋 SCHEME</div>
                                <div class="info-value">${escapeHtml(cardInfo.Scheme || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">🗺️ STATE</div>
                                <div class="info-value">${escapeHtml(cardInfo.State || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">🏪 HOME FPS</div>
                                <div class="info-value">${escapeHtml(cardInfo.Home_FPS || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">⏰ REMAINING DAYS</div>
                                <div class="info-value">${family.remaining_days || 'N/A'} days</div>
                            </div>
                `;
                
                if (cardInfo.Address) {
                    html += `
                            <div class="info-item">
                                <div class="info-label">📍 ADDRESS</div>
                                <div class="info-value">${escapeHtml(cardInfo.Address.replace(/!/g, ', '))}</div>
                            </div>
                    `;
                }
                
                html += `</div>`;
                
                // Members Section
                if (members.length > 0) {
                    html += `
                        <div class="members-section">
                            <div class="section-title">👨‍👩‍👧‍👦 FAMILY MEMBERS (${members.length})</div>
                    `;
                    
                    members.forEach(member => {
                        html += `
                            <div class="member-item">
                                <div class="member-name">${escapeHtml(member.member_name || 'Unknown')}</div>
                                <div class="member-details">
                                    <span>👤 ${escapeHtml(member.relationship || 'MEMBER')}</span>
                                    <span>⚥ ${escapeHtml(member.gender || 'N/A')}</span>
                                    <span>✅ ${member.ekyc_status === 'Y' ? 'VERIFIED' : 'PENDING'}</span>
                                    <span>🆔 ${escapeHtml(member.uid_masked || 'N/A')}</span>
                                    <span>📅 ${member.cr_last_updated || 'N/A'}</span>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                }
                
                // Monthly Summary
                if (monthlySummary && monthlySummary.length > 0) {
                    html += `
                        <div class="summary-section">
                            <div class="section-title">📊 MONTHLY RATION SUMMARY</div>
                            <div class="summary-grid">
                    `;
                    
                    monthlySummary.forEach(month => {
                        html += `
                            <div class="summary-item">
                                <div class="summary-month">${escapeHtml(month.month)}</div>
                                <div>Members: ${month.member_count}</div>
                                <div>Captured: ${month.captured_on}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                }
                
                // Share Section
                const shareUrl = `${window.location.origin}${window.location.pathname}?aadhaars=${sources.join(',')}`;
                html += `
                    <div class="share-section">
                        <div class="share-link">
                            <input type="text" class="share-input" id="shareUrl${familyNumber}" value="${shareUrl}" readonly>
                            <button class="copy-btn" onclick="copyToClipboard('shareUrl${familyNumber}')">📋 COPY LINK</button>
                        </div>
                    </div>
                `;
                
                html += `</div>`;
                familyNumber++;
            }
            
            container.innerHTML = html;
        }
        
        function escapeHtml(str) {
            if (!str) return str;
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function copyToClipboard(elementId) {
            const input = document.getElementById(elementId);
            if (!input) return;
            
            input.select();
            document.execCommand('copy');
            
            const btn = input.nextElementSibling;
            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = '✓ COPIED!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }
        
        console.log('%c⚡ FAMILY INTELLIGENCE VIEWER | Developer Saif', 'color: #ff44cc; font-size: 14px; font-weight: bold;');
        console.log(`%c📊 Scanning ${aadhaarsList.length} Aadhaars`, 'color: #00ff88; font-size: 12px;');
    </script>
</body>
</html>
