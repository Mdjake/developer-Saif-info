<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Family Intelligence | GHOST NEO · Node Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #ff44cc;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #ff44cc;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #ff44cc20;
            color: #ff44cc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 120px;
            text-align: center;
            border-bottom: 3px solid #ff44cc;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #ff44cc;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Progress Log */
        .progress-log {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 8px 12px;
            margin: 5px 0;
            border-left: 3px solid;
            background: #0a0e0a;
            border-radius: 3px;
            line-height: 1.4;
        }

        .log-info { border-left-color: #00aaff; color: #88ccff; }
        .log-success { border-left-color: #00ff88; color: #88ffaa; }
        .log-warning { border-left-color: #ffaa00; color: #ffcc66; }
        .log-error { border-left-color: #ff3355; color: #ff8888; }

        /* Family Tree Container (Canvas + Node UI) */
        .family-tree-wrapper {
            background: #111418;
            border-radius: 20px;
            border: 1px solid #ff44cc30;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .tree-header {
            background: #1a1a2e;
            padding: 12px 20px;
            border-bottom: 1px solid #ff44cc40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tree-title {
            font-size: 1rem;
            color: #ff44cc;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tree-legend {
            display: flex;
            gap: 16px;
            font-size: 11px;
        }

        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .legend-card {
            display: inline-block;
            width: 16px;
            height: 12px;
            background: #ff44cc;
            border-radius: 3px;
            margin-right: 5px;
        }

        .canvas-container {
            position: relative;
            overflow-x: auto;
            overflow-y: auto;
            background: #0c0f12;
            min-height: 550px;
            max-height: 70vh;
        }

        #familyTreeCanvas {
            display: block;
            background: radial-gradient(circle at 20% 30%, #11181c, #080b0e);
            width: 100%;
            height: auto;
            cursor: grab;
        }

        #familyTreeCanvas:active {
            cursor: grabbing;
        }

        /* Tooltip for nodes */
        .node-tooltip {
            position: fixed;
            background: #0a0e0aee;
            backdrop-filter: blur(8px);
            border-left: 3px solid #ff44cc;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #f0f0f0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 1000;
            pointer-events: none;
            transition: 0.05s linear;
            font-family: monospace;
            max-width: 260px;
            white-space: normal;
        }

        /* Cards section fallback (original design hidden but kept as backup) */
        .classic-results {
            display: none;
        }

        .no-results {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            color: #aaa;
        }

        .share-section {
            background: #111418;
            border-radius: 16px;
            padding: 15px 20px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .share-link {
            display: flex;
            flex: 1;
            gap: 12px;
            flex-wrap: wrap;
        }

        .share-input {
            flex: 2;
            background: #1a1a2e;
            border: 1px solid #ff44cc60;
            padding: 10px;
            border-radius: 40px;
            color: #ffccf0;
            font-family: monospace;
            font-size: 12px;
        }

        .copy-btn {
            background: #ff44cc;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: #ff88dd;
            transform: scale(1.02);
        }

        .hidden {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff44cc;
            border-radius: 4px;
        }

        @media (max-width: 680px) {
            .tree-legend { font-size: 9px; }
            .tree-title { font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🌳 FAMILY INTELLIGENCE · NEO VISUAL</h1>
        <div class="subtitle">Powered by GHOST OSINT | Developer Saif — node tree + relationship arrows</div>
        <div class="status-badge" id="statusBadge">🔄 INITIALIZING...</div>
    </div>

    <div class="stats-bar" id="statsBar" style="display: none;">
        <div class="stat-card"><div class="stat-number" id="totalAadhaars">0</div><div class="stat-label">AADHAARS SCANNED</div></div>
        <div class="stat-card"><div class="stat-number" id="uniqueFamilies">0</div><div class="stat-label">UNIQUE FAMILIES</div></div>
        <div class="stat-card"><div class="stat-number" id="totalMembers">0</div><div class="stat-label">FAMILY MEMBERS</div></div>
        <div class="stat-card"><div class="stat-number" id="duplicatesRemoved">0</div><div class="stat-label">DUPLICATES</div></div>
    </div>

    <div id="progressContainer">
        <div class="progress-log" id="progressLog"></div>
    </div>

    <!-- DYNAMIC NODE VISUALIZATION for each family, rendered one after another -->
    <div id="treeVisualizationContainer"></div>

    <!-- hidden classic container removed, everything visual -->
</div>

<script>
    // ---------- ORIGINAL API CONFIG & SCANNING LOGIC (100% preserved) ----------
    const API_URL = 'https://aadharfam.onrender.com/full-search';
    const MAX_CONCURRENT = 5;
    let uniqueFamilies = new Map();
    let processedAadhaars = new Set();
    let totalDuplicates = 0;
    let isScanComplete = false;

    const urlParams = new URLSearchParams(window.location.search);
    let aadhaarsList = [];
    if (urlParams.has('aadhaars')) {
        aadhaarsList = urlParams.get('aadhaars').split(',').map(a => a.trim()).filter(a => a.length > 0);
    } else if (urlParams.has('aadhaar')) {
        aadhaarsList = [urlParams.get('aadhaar').trim()];
    } else if (urlParams.has('ids')) {
        aadhaarsList = urlParams.get('ids').split(',').map(a => a.trim());
    }
    aadhaarsList = [...new Set(aadhaarsList)];

    if (aadhaarsList.length > 0) {
        document.getElementById('statusBadge').innerHTML = `⚡ SCANNING ${aadhaarsList.length} AADHAAR(S)`;
        scanAllAadhaarsParallel();
    } else {
        document.getElementById('progressContainer').classList.add('hidden');
        document.getElementById('treeVisualizationContainer').innerHTML = `
            <div class="no-results">
                <div style="font-size:48px; margin-bottom:15px;">🆔</div>
                <div style="font-size:18px; color:#ff44cc;">No Aadhaar Numbers Provided</div>
                <div style="color:#aaa;">Use ?aadhaars=123456789012,987654321098</div>
            </div>`;
        document.getElementById('statusBadge').innerHTML = `❌ NO AADHAARS PROVIDED`;
    }

    async function scanAllAadhaarsParallel() {
        addLog(`🚀 Starting scan of ${aadhaarsList.length} Aadhaar(s) (${MAX_CONCURRENT} at a time)`, 'info');
        const results = [];
        const queue = [...aadhaarsList];
        
        async function processBatch(batch) {
            const batchPromises = batch.map(async (aadhaar) => {
                if (processedAadhaars.has(aadhaar)) {
                    addLog(`⏭️ Skipping duplicate: ${aadhaar}`, 'warning');
                    return null;
                }
                addLog(`🔍 Scanning: ${aadhaar}`, 'info');
                const data = await fetchFamilyData(aadhaar);
                if (data && data.success && data.details) {
                    processedAadhaars.add(aadhaar);
                    return { aadhaar, data };
                } else {
                    addLog(`❌ No data: ${aadhaar}`, 'error');
                    return null;
                }
            });
            const batchResults = await Promise.all(batchPromises);
            return batchResults.filter(r => r !== null);
        }
        
        for (let i = 0; i < queue.length; i += MAX_CONCURRENT) {
            const batch = queue.slice(i, i + MAX_CONCURRENT);
            const batchResults = await processBatch(batch);
            results.push(...batchResults);
            addLog(`📊 Progress: ${Math.min(i+MAX_CONCURRENT, queue.length)}/${queue.length} Aadhaars processed`, 'info');
        }
        
        addLog(`🔄 Organizing ${results.length} result(s) into unique families...`, 'info');
        for (const result of results) {
            const { aadhaar, data } = result;
            const rationCardId = data.ration_card_id;
            if (uniqueFamilies.has(rationCardId)) {
                const existing = uniqueFamilies.get(rationCardId);
                existing.sourceAadhaars.push(aadhaar);
                totalDuplicates++;
                addLog(`⚠️ Duplicate: ${rationCardId}`, 'warning');
            } else {
                data.sourceAadhaars = [aadhaar];
                uniqueFamilies.set(rationCardId, data);
                const memberCount = data.details?.members?.length || 0;
                addLog(`✅ New family: ${rationCardId} (${memberCount} members)`, 'success');
            }
        }
        updateStats();
        addLog(`🎉 COMPLETE! ${uniqueFamilies.size} unique family(ies) found`, 'success');
        isScanComplete = true;
        renderFamilyTrees();  // FULL VISUAL NODE + ARROWS
        document.getElementById('statusBadge').innerHTML = `✅ SCAN COMPLETE - ${uniqueFamilies.size} FAMILIES • NODE VIEW`;
    }

    async function fetchFamilyData(aadhaar) {
        const url = `${API_URL}?aadhaar=${aadhaar}`;
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);
            if (response.ok) return await response.json();
        } catch(e) {}
        try {
            const proxyUrl = `https://cors-anywhere.herokuapp.com/${url}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            const response = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            if (response.ok) return await response.json();
        } catch(e) {}
        return null;
    }

    function addLog(message, type = 'info') {
        const logContainer = document.getElementById('progressLog');
        const logEntry = document.createElement('div');
        logEntry.className = `log-entry log-${type}`;
        let displayMessage = message;
        if (type === 'info' && message.includes('Scanning:')) displayMessage = `🔄 ${message}`;
        else if (type === 'success') displayMessage = `✅ ${message}`;
        else if (type === 'error') displayMessage = `❌ ${message}`;
        else if (type === 'warning') displayMessage = `⚠️ ${message}`;
        logEntry.innerHTML = `${getTimestamp()} ${displayMessage}`;
        logContainer.appendChild(logEntry);
        logContainer.scrollTop = logContainer.scrollHeight;
    }
    function getTimestamp() { return `[${new Date().toLocaleTimeString()}]`; }
    function updateStats() {
        const totalMembers = Array.from(uniqueFamilies.values()).reduce((sum, f) => sum + (f.details?.members?.length || 0), 0);
        document.getElementById('totalAadhaars').textContent = processedAadhaars.size;
        document.getElementById('uniqueFamilies').textContent = uniqueFamilies.size;
        document.getElementById('totalMembers').textContent = totalMembers;
        document.getElementById('duplicatesRemoved').textContent = totalDuplicates;
        document.getElementById('statsBar').style.display = 'flex';
    }

    // ---------- NODE VISUALIZATION ENGINE (tree + relationship arrows) ----------
    function renderFamilyTrees() {
        const container = document.getElementById('treeVisualizationContainer');
        if (uniqueFamilies.size === 0) {
            container.innerHTML = `<div class="no-results"><div style="font-size:48px;">🌑</div><div style="color:#ff44cc;">No Family Data Found</div></div>`;
            return;
        }
        let globalHtml = '';
        let familyIdx = 0;
        for (const [rationCardId, family] of uniqueFamilies.entries()) {
            familyIdx++;
            const members = family.details?.members || [];
            if (members.length === 0) continue;
            // Prepare nodes data: each member has name, relationship, gender, ekyc
            const nodes = members.map((mem, idx) => ({
                id: idx,
                name: mem.member_name || `Member ${idx+1}`,
                relation: mem.relationship || 'Family Member',
                gender: mem.gender || 'N/A',
                ekyc: mem.ekyc_status === 'Y' ? '✓ Verified' : 'Pending',
                uidMask: mem.uid_masked || '****'
            }));
            // define hierarchy: we assign head (generally "Head" or first member as root)
            let rootIndex = nodes.findIndex(n => n.relation.toLowerCase().includes('head'));
            if (rootIndex === -1 && nodes.length) rootIndex = 0;
            // Build edges based on relationship semantics: 
            // spouse -> connect to head; son/daughter connect to head; others sibling-like but we build simple root-spouse-child tree
            const edges = [];
            if (rootIndex !== -1) {
                for (let i = 0; i < nodes.length; i++) {
                    if (i === rootIndex) continue;
                    const rel = nodes[i].relation.toLowerCase();
                    if (rel.includes('wife') || rel.includes('husband') || rel.includes('spouse')) {
                        edges.push({ from: rootIndex, to: i, type: 'spouse' });
                    } else if (rel.includes('son') || rel.includes('daughter') || rel.includes('child')) {
                        edges.push({ from: rootIndex, to: i, type: 'child' });
                    } else {
                        // default attach to root
                        edges.push({ from: rootIndex, to: i, type: 'relative' });
                    }
                }
            } else {
                // fallback: chain first node to others
                for (let i=1; i<nodes.length; i++) edges.push({ from: 0, to: i, type: 'member' });
            }
            // Card Info block (short summary)
            const cardInfo = family.details?.card_info || {};
            const sourceStr = family.sourceAadhaars.join(', ');
            const shareUrl = `${window.location.origin}${window.location.pathname}?aadhaars=${family.sourceAadhaars.join(',')}`;
            
            globalHtml += `
                <div class="family-tree-wrapper" data-family-idx="${familyIdx}">
                    <div class="tree-header">
                        <div class="tree-title">🎫 ${escapeHtml(rationCardId)}  |  ${escapeHtml(cardInfo.District || 'District')} · ${escapeHtml(cardInfo.Scheme || 'Ration')}</div>
                        <div class="tree-legend">
                            <span><span class="legend-dot" style="background:#ff44cc;"></span> Head</span>
                            <span><span class="legend-dot" style="background:#3bc9db;"></span> Spouse</span>
                            <span><span class="legend-dot" style="background:#f59f00;"></span> Child/Relative</span>
                            <span><span class="legend-card"></span> ⇨ Relationship Arrow</span>
                        </div>
                    </div>
                    <div class="canvas-container" id="canvasWrap_${familyIdx}">
                        <canvas id="treeCanvas_${familyIdx}" width="900" height="500" style="width:100%; height:auto; min-width:700px;"></canvas>
                    </div>
                    <div class="share-section">
                        <div class="share-link">
                            <input type="text" class="share-input" id="shareUrl_${familyIdx}" value="${escapeHtml(shareUrl)}" readonly>
                            <button class="copy-btn" onclick="copyToClipboard('shareUrl_${familyIdx}')">📋 COPY LINK</button>
                        </div>
                        <div style="font-size:11px; color:#aaa;">🖱️ Hover nodes → details | Drag canvas</div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = globalHtml;
        // After DOM insertion, draw each canvas
        let canvasIndex = 0;
        for (const [rationCardId, family] of uniqueFamilies.entries()) {
            canvasIndex++;
            const membersRaw = family.details?.members || [];
            if (membersRaw.length === 0) continue;
            const nodes = membersRaw.map((mem, idx) => ({
                id: idx, name: mem.member_name || `Member ${idx+1}`,
                relation: mem.relationship || 'Member', gender: mem.gender || 'N/A',
                ekyc: mem.ekyc_status === 'Y' ? '✓ eKYC' : '⏳ Pending',
                uidMask: mem.uid_masked || '----'
            }));
            let rootIdx = nodes.findIndex(n => n.relation.toLowerCase().includes('head'));
            if (rootIdx === -1 && nodes.length) rootIdx = 0;
            const edges = [];
            for (let i=0; i<nodes.length; i++) {
                if (i === rootIdx) continue;
                const rl = nodes[i].relation.toLowerCase();
                let type = 'relative';
                if (rl.includes('wife') || rl.includes('husband') || rl.includes('spouse')) type = 'spouse';
                else if (rl.includes('son') || rl.includes('daughter') || rl.includes('child')) type = 'child';
                edges.push({ from: rootIdx, to: i, type });
            }
            const canvas = document.getElementById(`treeCanvas_${canvasIndex}`);
            if (canvas) drawTreeWithArrows(canvas, nodes, edges, rootIdx);
            enableCanvasDrag(canvas);
        }
    }

    // ---------- DRAW HIERARCHY WITH CURVED ARROWS, RADIAL LAYOUT ----------
    function drawTreeWithArrows(canvas, nodes, edges, rootId) {
        if (!canvas || nodes.length === 0) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.clientWidth;
        let height = canvas.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(800, width);
        canvas.height = Math.max(450, height);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // layout: radial / tree positioning
        const centerX = canvas.width / 2;
        const startY = 80;
        const levelHeight = 100;
        const radiusX = Math.min(180, canvas.width * 0.25);
        
        // assign level: 0 = root, spouse same level? we put spouse side by side, children below.
        let nodePositions = new Array(nodes.length);
        // root position
        nodePositions[rootId] = { x: centerX, y: startY, level:0 };
        // find spouse nodes (close to root horizontally)
        const spouseIds = edges.filter(e => e.type === 'spouse').map(e => e.to);
        let spouseXOffset = 130;
        let spouseIndex = 0;
        spouseIds.forEach((id, idx) => {
            nodePositions[id] = { x: centerX + (idx % 2 === 0 ? spouseXOffset : -spouseXOffset), y: startY + 15, level:0 };
        });
        // children and others: BFS style
        let queue = [rootId];
        let visited = new Set([rootId]);
        let depthMap = new Map();
        depthMap.set(rootId, 0);
        while(queue.length) {
            let current = queue.shift();
            let children = edges.filter(e => e.from === current && !spouseIds.includes(e.to)).map(e => e.to);
            let currentDepth = depthMap.get(current) || 0;
            let childCount = children.length;
            let startX = nodePositions[current].x - ((childCount-1) * 45)/2;
            children.forEach((child, ci) => {
                if(!visited.has(child)){
                    visited.add(child);
                    depthMap.set(child, currentDepth+1);
                    let xPos = startX + ci * 90;
                    let yPos = nodePositions[current].y + levelHeight;
                    nodePositions[child] = { x: xPos, y: yPos, level: currentDepth+1 };
                    queue.push(child);
                }
            });
        }
        // assign any missing nodes (fallback)
        for(let i=0; i<nodes.length; i++) if(!nodePositions[i]) nodePositions[i] = { x: centerX + (i*70), y: startY+150, level:1 };
        
        // draw edges (arrows with quadratic curves)
        ctx.save();
        ctx.shadowBlur = 0;
        for (let edge of edges) {
            const fromPos = nodePositions[edge.from];
            const toPos = nodePositions[edge.to];
            if(!fromPos || !toPos) continue;
            let startX = fromPos.x, startY = fromPos.y;
            let endX = toPos.x, endY = toPos.y;
            let cp1x = startX + (endX - startX)*0.3;
            let cp1y = startY + 15;
            let cp2x = endX - (endX - startX)*0.3;
            let cp2y = endY - 15;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, endX, endY);
            ctx.strokeStyle = edge.type === 'spouse' ? '#ff88aa' : (edge.type === 'child' ? '#66ffcc' : '#aaaaee');
            ctx.lineWidth = 2.2;
            ctx.setLineDash(edge.type === 'spouse' ? [6, 6] : []);
            ctx.stroke();
            ctx.setLineDash([]);
            // arrowhead
            let angle = Math.atan2(endY - cp2y, endX - cp2x);
            let arrowX = endX - 10 * Math.cos(angle);
            let arrowY = endY - 10 * Math.sin(angle);
            ctx.fillStyle = ctx.strokeStyle;
            ctx.beginPath();
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - 7 * Math.cos(angle - Math.PI/6), arrowY - 7 * Math.sin(angle - Math.PI/6));
            ctx.lineTo(arrowX - 7 * Math.cos(angle + Math.PI/6), arrowY - 7 * Math.sin(angle + Math.PI/6));
            ctx.fill();
        }
        
        // draw nodes (glowing cards)
        for (let i=0; i<nodes.length; i++) {
            const pos = nodePositions[i];
            const node = nodes[i];
            let nodeColor = '#ff44cc'; // head
            if (i !== rootId) {
                if (node.relation.toLowerCase().includes('wife') || node.relation.toLowerCase().includes('husband')) nodeColor = '#3bc9db';
                else nodeColor = '#f59f00';
            }
            ctx.shadowBlur = 10;
            ctx.shadowColor = nodeColor + '80';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 32, 0, 2*Math.PI);
            ctx.fillStyle = '#1e1e2e';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 29, 0, 2*Math.PI);
            ctx.fillStyle = nodeColor + '30';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 26, 0, 2*Math.PI);
            ctx.fillStyle = '#0a0e0add';
            ctx.fill();
            ctx.fillStyle = '#ffffffdd';
            ctx.font = 'bold 12px "Segoe UI"';
            ctx.shadowBlur = 2;
            ctx.fillText(node.name.length > 18 ? node.name.slice(0,16)+'..' : node.name, pos.x-25, pos.y-8);
            ctx.font = '10px monospace';
            ctx.fillStyle = '#ffccaa';
            ctx.fillText(node.relation, pos.x-22, pos.y+10);
            ctx.fillStyle = '#88ddff';
            ctx.fillText(node.gender, pos.x+18, pos.y+16);
            // small icon ekyc
            ctx.fillStyle = node.ekyc.includes('✓') ? '#0f6' : '#fa0';
            ctx.beginPath();
            ctx.arc(pos.x+22, pos.y-16, 6, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 8px monospace';
            ctx.fillText(node.ekyc === '✓ Verified' ? '✓' : '!', pos.x+19, pos.y-13);
        }
        ctx.shadowBlur = 0;
        // tooltip overlay events: add hover detection to canvas
        attachTooltipToCanvas(canvas, nodes, nodePositions);
    }

    let activeTooltip = null;
    function attachTooltipToCanvas(canvas, nodes, positions) {
        const onMouseMove = (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            let hovered = null;
            for (let i=0; i<nodes.length; i++) {
                const p = positions[i];
                if(p && Math.hypot(mouseX - p.x, mouseY - p.y) < 30) {
                    hovered = nodes[i];
                    break;
                }
            }
            if (hovered) {
                if (!activeTooltip) {
                    activeTooltip = document.createElement('div');
                    activeTooltip.className = 'node-tooltip';
                    document.body.appendChild(activeTooltip);
                }
                activeTooltip.innerHTML = `<strong>${escapeHtml(hovered.name)}</strong><br>👥 ${escapeHtml(hovered.relation)}<br>⚥ ${escapeHtml(hovered.gender)}<br>🔒 ${escapeHtml(hovered.ekyc)}<br>🆔 ${escapeHtml(hovered.uidMask)}`;
                activeTooltip.style.left = (e.clientX + 12) + 'px';
                activeTooltip.style.top = (e.clientY - 35) + 'px';
                activeTooltip.style.display = 'block';
            } else {
                if(activeTooltip) activeTooltip.style.display = 'none';
            }
        };
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mouseleave', () => { if(activeTooltip) activeTooltip.style.display = 'none'; });
    }
    
    function enableCanvasDrag(canvas) {
        let isDown = false;
        let startX, startY, scrollLeft, scrollTop;
        const container = canvas.parentElement;
        if(!container) return;
        const onMouseDown = (e) => { isDown = true; startX = e.pageX - container.offsetLeft; startY = e.pageY - container.offsetTop; scrollLeft = container.scrollLeft; scrollTop = container.scrollTop; };
        const onMouseLeave = () => { isDown = false; };
        const onMouseUp = () => { isDown = false; };
        const onMouseMove = (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - container.offsetLeft;
            const y = e.pageY - container.offsetTop;
            const walkX = (x - startX);
            const walkY = (y - startY);
            container.scrollLeft = scrollLeft - walkX;
            container.scrollTop = scrollTop - walkY;
        };
        container.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('mousemove', onMouseMove);
        container.addEventListener('mouseleave', onMouseLeave);
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    window.copyToClipboard = function(id) {
        const inp = document.getElementById(id);
        if(inp) { inp.select(); document.execCommand('copy'); const btn = inp.nextElementSibling; if(btn){ let orig = btn.innerText; btn.innerText='✓ COPIED!'; setTimeout(()=> btn.innerText=orig,1500); } }
    };
</script>
