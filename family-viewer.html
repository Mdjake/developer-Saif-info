<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Family Intelligence | GHOST NEO · Node Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #ff44cc;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #ff44cc;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #ff44cc20;
            color: #ff44cc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            flex: 1;
            min-width: 120px;
            text-align: center;
            border-bottom: 3px solid #ff44cc;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #ff44cc;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .progress-log {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 8px 12px;
            margin: 5px 0;
            border-left: 3px solid;
            background: #0a0e0a;
            border-radius: 3px;
            line-height: 1.4;
        }

        .log-info { border-left-color: #00aaff; color: #88ccff; }
        .log-success { border-left-color: #00ff88; color: #88ffaa; }
        .log-warning { border-left-color: #ffaa00; color: #ffcc66; }
        .log-error { border-left-color: #ff3355; color: #ff8888; }

        .family-tree-wrapper {
            background: #111418;
            border-radius: 20px;
            border: 1px solid #ff44cc30;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .tree-header {
            background: #1a1a2e;
            padding: 12px 20px;
            border-bottom: 1px solid #ff44cc40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tree-title {
            font-size: 1rem;
            color: #ff44cc;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .tree-legend {
            display: flex;
            gap: 16px;
            font-size: 11px;
        }

        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .legend-dot.head { background: #ff44cc; }
        .legend-dot.spouse { background: #3bc9db; }
        .legend-dot.child { background: #f59f00; }

        .canvas-container {
            position: relative;
            overflow: auto;
            background: #0c0f12;
            min-height: 550px;
            max-height: 70vh;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        #familyTreeCanvas {
            display: block;
            background: radial-gradient(circle at 20% 30%, #11181c, #080b0e);
            min-width: 100%;
            height: auto;
        }

        .node-tooltip {
            position: fixed;
            background: #0a0e0aee;
            backdrop-filter: blur(8px);
            border-left: 3px solid #ff44cc;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #f0f0f0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 1000;
            pointer-events: none;
            font-family: monospace;
            max-width: 260px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #1a1a2e;
        }

        .info-item {
            background: #0a0e0a;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #ff44cc;
        }

        .info-label {
            font-size: 10px;
            color: #ff44cc;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 14px;
            color: #ddd;
            word-break: break-word;
        }

        .share-section {
            padding: 20px;
            border-top: 1px solid #2a2a4e;
            background: #0a0e0a;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .share-link {
            display: flex;
            flex: 1;
            gap: 10px;
            flex-wrap: wrap;
        }

        .share-input {
            flex: 1;
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #ff44cc40;
            border-radius: 5px;
            color: #ff44cc;
            font-size: 12px;
            font-family: monospace;
        }

        .copy-btn {
            background: #ff44cc;
            color: #0a0e0a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            background: #ff66dd;
            transform: scale(1.02);
        }

        .no-results {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            color: #aaa;
        }

        .hidden {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff44cc;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .tree-legend { font-size: 9px; }
            .stats-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌳 FAMILY INTELLIGENCE · NEO VISUAL</h1>
            <div class="subtitle">Powered by GHOST OSINT | Developer Saif — Node Tree + Relationship Arrows</div>
            <div class="status-badge" id="statusBadge">🔄 INITIALIZING...</div>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalAadhaars">0</div>
                <div class="stat-label">AADHAARS SCANNED</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueFamilies">0</div>
                <div class="stat-label">UNIQUE FAMILIES</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalMembers">0</div>
                <div class="stat-label">FAMILY MEMBERS</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="duplicatesRemoved">0</div>
                <div class="stat-label">DUPLICATES</div>
            </div>
        </div>

        <div id="progressContainer">
            <div class="progress-log" id="progressLog"></div>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        // Configuration (EXACT same as original)
        const API_URL = 'https://aadharfam.onrender.com/full-search';
        const MAX_CONCURRENT = 5;
        
        // State
        let uniqueFamilies = new Map();
        let processedAadhaars = new Set();
        let totalDuplicates = 0;
        let isScanComplete = false;
        
        // Get Aadhaars from URL
        const urlParams = new URLSearchParams(window.location.search);
        let aadhaarsList = [];
        
        if (urlParams.has('aadhaars')) {
            aadhaarsList = urlParams.get('aadhaars').split(',').map(a => a.trim()).filter(a => a.length > 0);
        } else if (urlParams.has('aadhaar')) {
            aadhaarsList = [urlParams.get('aadhaar').trim()];
        } else if (urlParams.has('ids')) {
            aadhaarsList = urlParams.get('ids').split(',').map(a => a.trim());
        }
        
        aadhaarsList = [...new Set(aadhaarsList)];
        
        if (aadhaarsList.length > 0) {
            document.getElementById('statusBadge').innerHTML = `⚡ SCANNING ${aadhaarsList.length} AADHAAR(S)`;
            scanAllAadhaarsParallel();
        } else {
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('resultsContainer').innerHTML = `
                <div class="no-results">
                    <div style="font-size: 48px; margin-bottom: 15px;">🆔</div>
                    <div style="font-size: 18px; color: #ff44cc; margin-bottom: 10px;">No Aadhaar Numbers Provided</div>
                    <div style="color: #aaa; font-size: 14px;">Use: ?aadhaars=123456789012,987654321098</div>
                </div>
            `;
            document.getElementById('statusBadge').innerHTML = `❌ NO AADHAARS PROVIDED`;
        }
        
        async function scanAllAadhaarsParallel() {
            addLog(`🚀 Starting scan of ${aadhaarsList.length} Aadhaar(s) (${MAX_CONCURRENT} at a time)`, 'info');
            
            const results = [];
            const queue = [...aadhaarsList];
            let completedCount = 0;
            
            async function processBatch(batch) {
                const batchPromises = batch.map(async (aadhaar) => {
                    if (processedAadhaars.has(aadhaar)) {
                        addLog(`⏭️ Skipping duplicate: ${aadhaar}`, 'warning');
                        return null;
                    }
                    
                    addLog(`🔍 Scanning: ${aadhaar}`, 'info');
                    const data = await fetchFamilyData(aadhaar);
                    
                    if (data && data.success && data.details) {
                        processedAadhaars.add(aadhaar);
                        return { aadhaar, data };
                    } else {
                        addLog(`❌ No data: ${aadhaar}`, 'error');
                        return null;
                    }
                });
                
                const batchResults = await Promise.all(batchPromises);
                return batchResults.filter(r => r !== null);
            }
            
            for (let i = 0; i < queue.length; i += MAX_CONCURRENT) {
                const batch = queue.slice(i, i + MAX_CONCURRENT);
                const batchResults = await processBatch(batch);
                results.push(...batchResults);
                
                completedCount = Math.min(i + MAX_CONCURRENT, queue.length);
                addLog(`📊 Progress: ${completedCount}/${queue.length} Aadhaars processed`, 'info');
            }
            
            addLog(`🔄 Organizing ${results.length} result(s) into unique families...`, 'info');
            
            for (const result of results) {
                const { aadhaar, data } = result;
                const rationCardId = data.ration_card_id;
                
                if (uniqueFamilies.has(rationCardId)) {
                    const existing = uniqueFamilies.get(rationCardId);
                    existing.sourceAadhaars.push(aadhaar);
                    totalDuplicates++;
                    addLog(`⚠️ Duplicate: ${rationCardId} (also from ${existing.sourceAadhaars[0]})`, 'warning');
                } else {
                    data.sourceAadhaars = [aadhaar];
                    uniqueFamilies.set(rationCardId, data);
                    const memberCount = data.details?.members?.length || 0;
                    addLog(`✅ New family: ${rationCardId} (${memberCount} members)`, 'success');
                }
            }
            
            updateStats();
            addLog(`🎉 COMPLETE! ${uniqueFamilies.size} unique family(ies) found`, 'success');
            
            isScanComplete = true;
            displayResults();
            document.getElementById('statusBadge').innerHTML = `✅ SCAN COMPLETE - ${uniqueFamilies.size} FAMILIES FOUND`;
        }
        
        async function fetchFamilyData(aadhaar) {
            const url = `${API_URL}?aadhaar=${aadhaar}`;
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {}
            
            try {
                const proxyUrl = `https://cors-anywhere.herokuapp.com/${url}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {}
            
            return null;
        }
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('progressLog');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            
            let displayMessage = message;
            if (type === 'info' && message.includes('Scanning:') && !isScanComplete) {
                displayMessage = `🔄 ${message}`;
            } else if (type === 'success') {
                displayMessage = `✅ ${message}`;
            } else if (type === 'error') {
                displayMessage = `❌ ${message}`;
            } else if (type === 'warning') {
                displayMessage = `⚠️ ${message}`;
            }
            
            logEntry.innerHTML = `${getTimestamp()} ${displayMessage}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function getTimestamp() {
            const now = new Date();
            return `[${now.toLocaleTimeString()}]`;
        }
        
        function updateStats() {
            const totalMembers = Array.from(uniqueFamilies.values()).reduce((sum, f) => sum + (f.details?.members?.length || 0), 0);
            
            document.getElementById('totalAadhaars').textContent = processedAadhaars.size;
            document.getElementById('uniqueFamilies').textContent = uniqueFamilies.size;
            document.getElementById('totalMembers').textContent = totalMembers;
            document.getElementById('duplicatesRemoved').textContent = totalDuplicates;
            document.getElementById('statsBar').style.display = 'flex';
        }
        
        function displayResults() {
            const container = document.getElementById('resultsContainer');
            
            if (uniqueFamilies.size === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div style="font-size: 48px; margin-bottom: 15px;">❌</div>
                        <div style="font-size: 18px; color: #ff44cc; margin-bottom: 10px;">No Family Data Found</div>
                        <div style="color: #aaa; font-size: 14px;">No valid family information found for the provided Aadhaar numbers.</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let familyNumber = 1;
            
            for (const [rationCardId, family] of uniqueFamilies) {
                const details = family.details;
                const cardInfo = details.card_info || {};
                const members = details.members || [];
                const monthlySummary = details.monthly_summary || [];
                const sources = family.sourceAadhaars;
                
                // Card Info Section (preserved from original)
                html += `
                    <div class="family-card" style="background: #1a1a2e; border-radius: 15px; margin-bottom: 25px; overflow: hidden; border: 1px solid #2a2a4e;">
                        <div class="card-header" style="background: linear-gradient(135deg, #ff44cc20, #2a1a4e); padding: 20px; border-bottom: 1px solid #ff44cc40;">
                            <div class="card-title" style="font-size: 20px; font-weight: bold; color: #ff44cc; margin-bottom: 8px;">🎫 FAMILY #${familyNumber}: ${rationCardId}</div>
                            <div class="card-subtitle" style="font-size: 12px; color: #aaa;">
                                Found from ${sources.length} Aadhaar source(s)
                                ${sources.length > 1 ? '<span style="color: #ff44cc; margin-left: 8px;">✨ Auto-deduplicated</span>' : ''}
                            </div>
                            <div class="source-badge" style="display: inline-block; background: #ff44cc20; color: #ff44cc; padding: 3px 10px; border-radius: 15px; font-size: 11px; margin-top: 8px;">🆔 Sources: ${sources.join(', ')}</div>
                        </div>
                        
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">🏠 CARD TYPE</div>
                                <div class="info-value">${escapeHtml(cardInfo.Card_Type || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📍 DISTRICT</div>
                                <div class="info-value">${escapeHtml(cardInfo.District || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📅 ISSUE DATE</div>
                                <div class="info-value">${escapeHtml(cardInfo.Issue_Date || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📋 SCHEME</div>
                                <div class="info-value">${escapeHtml(cardInfo.Scheme || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">🗺️ STATE</div>
                                <div class="info-value">${escapeHtml(cardInfo.State || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">🏪 HOME FPS</div>
                                <div class="info-value">${escapeHtml(cardInfo.Home_FPS || 'N/A')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">⏰ REMAINING DAYS</div>
                                <div class="info-value">${family.remaining_days || 'N/A'} days</div>
                            </div>
                `;
                
                if (cardInfo.Address) {
                    html += `
                            <div class="info-item">
                                <div class="info-label">📍 ADDRESS</div>
                                <div class="info-value">${escapeHtml(cardInfo.Address.replace(/!/g, ', '))}</div>
                            </div>
                    `;
                }
                
                html += `</div>`;
                
                // TREE VISUALIZATION SECTION (NEW)
                if (members.length > 0) {
                    html += `
                        <div class="family-tree-wrapper" style="margin: 20px;">
                            <div class="tree-header" style="background: #1a1a2e; padding: 12px 20px; border-bottom: 1px solid #ff44cc40; display: flex; justify-content: space-between; align-items: center;">
                                <div class="tree-title">🌳 FAMILY TREE · RELATIONSHIP MAP</div>
                                <div class="tree-legend">
                                    <span><span class="legend-dot head"></span> Head</span>
                                    <span><span class="legend-dot spouse"></span> Spouse</span>
                                    <span><span class="legend-dot child"></span> Child/Relative</span>
                                    <span><span style="display: inline-block; width: 16px; height: 2px; background: #ff88aa; margin-right: 5px;"></span> Spouse Link</span>
                                    <span><span style="display: inline-block; width: 16px; height: 2px; background: #66ffcc; margin-right: 5px;"></span> Parent-Child</span>
                                </div>
                            </div>
                            <div class="canvas-container" id="canvasWrap_${familyNumber}" style="overflow: auto; background: #0c0f12; min-height: 500px; cursor: grab;">
                                <canvas id="treeCanvas_${familyNumber}" style="display: block; background: radial-gradient(circle at 20% 30%, #11181c, #080b0e); min-width: 100%;"></canvas>
                            </div>
                        </div>
                    `;
                }
                
                // Monthly Summary Section
                if (monthlySummary && monthlySummary.length > 0) {
                    html += `
                        <div class="summary-section" style="padding: 0 20px 20px 20px;">
                            <div class="section-title" style="font-size: 16px; color: #ff44cc; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #ff44cc40;">📊 MONTHLY RATION SUMMARY</div>
                            <div class="summary-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                    `;
                    
                    monthlySummary.forEach(month => {
                        html += `
                            <div class="summary-item" style="background: #0a0e0a; padding: 12px; border-radius: 8px; text-align: center;">
                                <div class="summary-month" style="color: #ff44cc; font-weight: bold; margin-bottom: 5px;">${escapeHtml(month.month)}</div>
                                <div>Members: ${month.member_count}</div>
                                <div>Captured: ${month.captured_on}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                }
                
                // Share Section
                const shareUrl = `${window.location.origin}${window.location.pathname}?aadhaars=${sources.join(',')}`;
                html += `
                    <div class="share-section">
                        <div class="share-link">
                            <input type="text" class="share-input" id="shareUrl${familyNumber}" value="${shareUrl}" readonly>
                            <button class="copy-btn" onclick="copyToClipboard('shareUrl${familyNumber}')">📋 COPY LINK</button>
                        </div>
                    </div>
                `;
                
                html += `</div>`;
                familyNumber++;
            }
            
            container.innerHTML = html;
            
            // Draw all trees after DOM is ready
            setTimeout(() => {
                let famIdx = 1;
                for (const [rationCardId, family] of uniqueFamilies) {
                    const members = family.details?.members || [];
                    if (members.length > 0) {
                        drawFamilyTree(famIdx, members);
                        enableCanvasDrag(`canvasWrap_${famIdx}`);
                    }
                    famIdx++;
                }
            }, 100);
        }
        
        function drawFamilyTree(familyNumber, members) {
            const canvas = document.getElementById(`treeCanvas_${familyNumber}`);
            if (!canvas) return;
            
            const container = document.getElementById(`canvasWrap_${familyNumber}`);
            if (!container) return;
            
            // Set canvas size
            const width = Math.max(900, container.clientWidth);
            const height = 500;
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = '100%';
            canvas.style.height = 'auto';
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, width, height);
            
            if (members.length === 0) return;
            
            // Prepare nodes
            const nodes = members.map((member, idx) => ({
                id: idx,
                name: member.member_name || `Member ${idx + 1}`,
                relation: member.relationship || 'Family Member',
                gender: member.gender || 'N/A',
                ekyc: member.ekyc_status === 'Y' ? '✓ Verified' : '⏳ Pending',
                uid: member.uid_masked || 'N/A'
            }));
            
            // Find head of family
            let headIndex = nodes.findIndex(n => n.relation.toLowerCase().includes('head'));
            if (headIndex === -1) headIndex = 0;
            
            // Build relationship edges
            const edges = [];
            for (let i = 0; i < nodes.length; i++) {
                if (i === headIndex) continue;
                const relation = nodes[i].relation.toLowerCase();
                if (relation.includes('wife') || relation.includes('husband') || relation.includes('spouse')) {
                    edges.push({ from: headIndex, to: i, type: 'spouse' });
                } else if (relation.includes('son') || relation.includes('daughter') || relation.includes('child')) {
                    edges.push({ from: headIndex, to: i, type: 'child' });
                } else {
                    edges.push({ from: headIndex, to: i, type: 'relative' });
                }
            }
            
            // Calculate positions (radial/hierarchical layout)
            const positions = [];
            const centerX = width / 2;
            const startY = 80;
            const levelHeight = 100;
            
            // Position head
            positions[headIndex] = { x: centerX, y: startY };
            
            // Position spouse(s)
            const spouseIndices = edges.filter(e => e.type === 'spouse').map(e => e.to);
            spouseIndices.forEach((spouseId, idx) => {
                positions[spouseId] = { x: centerX + (idx % 2 === 0 ? 150 : -150), y: startY + 20 };
            });
            
            // Position children and others
            const childrenIndices = edges.filter(e => e.type === 'child' || e.type === 'relative').map(e => e.to);
            const childCount = childrenIndices.length;
            const startX = centerX - ((childCount - 1) * 80) / 2;
            
            childrenIndices.forEach((childId, idx) => {
                positions[childId] = { x: startX + idx * 80, y: startY + levelHeight };
            });
            
            // Fill any missing positions
            for (let i = 0; i < nodes.length; i++) {
                if (!positions[i]) {
                    positions[i] = { x: centerX + (i * 60), y: startY + 180 };
                }
            }
            
            // Draw edges (arrows)
            for (const edge of edges) {
                const from = positions[edge.from];
                const to = positions[edge.to];
                if (!from || !to) continue;
                
                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                
                // Control points for curve
                const midX = (from.x + to.x) / 2;
                const midY = (from.y + to.y) / 2 - 20;
                ctx.quadraticCurveTo(midX, midY, to.x, to.y);
                
                // Set style based on edge type
                if (edge.type === 'spouse') {
                    ctx.strokeStyle = '#ff88aa';
                    ctx.setLineDash([8, 6]);
                } else {
                    ctx.strokeStyle = '#66ffcc';
                    ctx.setLineDash([]);
                }
                ctx.lineWidth = 2.5;
                ctx.stroke();
                
                // Draw arrowhead
                const angle = Math.atan2(to.y - midY, to.x - midX);
                const arrowSize = 10;
                const arrowX = to.x - 12 * Math.cos(angle);
                const arrowY = to.y - 12 * Math.sin(angle);
                
                ctx.fillStyle = ctx.strokeStyle;
                ctx.beginPath();
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - arrowSize * Math.cos(angle - Math.PI / 6), arrowY - arrowSize * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(arrowX - arrowSize * Math.cos(angle + Math.PI / 6), arrowY - arrowSize * Math.sin(angle + Math.PI / 6));
                ctx.fill();
            }
            
            ctx.setLineDash([]);
            
            // Draw nodes
            for (let i = 0; i < nodes.length; i++) {
                const pos = positions[i];
                const node = nodes[i];
                
                // Determine node color
                let nodeColor = '#ff44cc'; // Head
                if (i !== headIndex) {
                    if (node.relation.toLowerCase().includes('wife') || node.relation.toLowerCase().includes('husband')) {
                        nodeColor = '#3bc9db'; // Spouse
                    } else {
                        nodeColor = '#f59f00'; // Child/Relative
                    }
                }
                
                // Draw outer glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = nodeColor + '80';
                
                // Node circle
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 35, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e1e2e';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 32, 0, 2 * Math.PI);
                ctx.fillStyle = nodeColor + '30';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 28, 0, 2 * Math.PI);
                ctx.fillStyle = '#0a0e0a';
                ctx.fill();
                
                ctx.shadowBlur = 2;
                
                // Name
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px "Segoe UI"';
                ctx.textAlign = 'center';
                const displayName = node.name.length > 16 ? node.name.substring(0, 14) + '..' : node.name;
                ctx.fillText(displayName, pos.x, pos.y - 8);
                
                // Relation
                ctx.font = '10px monospace';
                ctx.fillStyle = '#ffccaa';
                ctx.fillText(node.relation, pos.x, pos.y + 8);
                
                // Gender
                ctx.fillStyle = '#88ddff';
                ctx.fillText(node.gender, pos.x, pos.y + 22);
                
                // eKYC status badge
                ctx.fillStyle = node.ekyc.includes('✓') ? '#00ff88' : '#ffaa00';
                ctx.beginPath();
                ctx.arc(pos.x + 24, pos.y - 20, 7, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 9px monospace';
                ctx.fillText(node.ekyc.includes('✓') ? '✓' : '!', pos.x + 21, pos.y - 17);
            }
            
            ctx.shadowBlur = 0;
            
            // Add tooltip functionality
            attachTooltips(canvas, nodes, positions);
        }
        
        function attachTooltips(canvas, nodes, positions) {
            let tooltip = null;
            
            const showTooltip = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                
                let hoveredNode = null;
                for (let i = 0; i < nodes.length; i++) {
                    const pos = positions[i];
                    if (pos && Math.hypot(mouseX - pos.x, mouseY - pos.y) < 35) {
                        hoveredNode = nodes[i];
                        break;
                    }
                }
                
                if (hoveredNode) {
                    if (!tooltip) {
                        tooltip = document.createElement('div');
                        tooltip.className = 'node-tooltip';
                        document.body.appendChild(tooltip);
                    }
                    tooltip.innerHTML = `
                        <strong>${escapeHtml(hoveredNode.name)}</strong><br>
                        👥 ${escapeHtml(hoveredNode.relation)}<br>
                        ⚥ ${escapeHtml(hoveredNode.gender)}<br>
                        ${hoveredNode.ekyc}<br>
                        🆔 ${escapeHtml(hoveredNode.uid)}
                    `;
                    tooltip.style.left = (e.clientX + 15) + 'px';
                    tooltip.style.top = (e.clientY - 40) + 'px';
                    tooltip.style.display = 'block';
                } else if (tooltip) {
                    tooltip.style.display = 'none';
                }
            };
            
            canvas.addEventListener('mousemove', showTooltip);
            canvas.addEventListener('mouseleave', () => {
                if (tooltip) tooltip.style.display = 'none';
            });
        }
        
        function enableCanvasDrag(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            let isDown = false;
            let startX, startY, scrollLeft, scrollTop;
            
            container.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - container.offsetLeft;
                startY = e.pageY - container.offsetTop;
                scrollLeft = container.scrollLeft;
                scrollTop = container.scrollTop;
                container.style.cursor = 'grabbing';
            });
            
            container.addEventListener('mouseleave', () => {
                isDown = false;
                container.style.cursor = 'grab';
            });
            
            container.addEventListener('mouseup', () => {
                isDown = false;
                container.style.cursor = 'grab';
            });
            
            container.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - container.offsetLeft;
                const y = e.pageY - container.offsetTop;
                const walkX = (x - startX);
                const walkY = (y - startY);
                container.scrollLeft = scrollLeft - walkX;
                container.scrollTop = scrollTop - walkY;
            });
            
            container.style.cursor = 'grab';
        }
        
        function escapeHtml(str) {
            if (!str) return str;
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function copyToClipboard(elementId) {
            const input = document.getElementById(elementId);
            if (!input) return;
            
            input.select();
            document.execCommand('copy');
            
            const btn = input.nextElementSibling;
            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = '✓ COPIED!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        }
    </script>
</body>
